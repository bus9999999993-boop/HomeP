  <!-- 중앙 미니멀 레트로 심볼 (카메라/액자 그래픽, 글자 일체 없음) -->
  <g transform="translate(140, 100)">
    <!-- 감성 사진 프레임 -->
    <rect x="-45" y="-35" width="90" height="70" fill="#FFFFFF" stroke="#7DC5E6" stroke-width="2"/>
    <!-- 풍경 일러스트 -->
    <path d="M-35 25 L-10 -5 L15 15 L35 0 L35 25 Z" fill="#E2F3FC"/>
    <circle cx="20" cy="-15" r="7" fill="#FCE68A"/>
  </g>
