<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="100%" height="100%">
  <!-- 배경: 연노랑 파스텔 -->
  <rect width="280" height="200" fill="#FFFDF5"/>
  <!-- 은은한 체크/도트 질감 -->
  <g fill="#F5E4BE" opacity="0.3">
    <circle cx="20" cy="20" r="2"/><circle cx="40" cy="20" r="2"/><circle cx="60" cy="20" r="2"/><circle cx="80" cy="20" r="2"/><circle cx="100" cy="20" r="2"/><circle cx="120" cy="20" r="2"/><circle cx="140" cy="20" r="2"/><circle cx="160" cy="20" r="2"/><circle cx="180" cy="20" r="2"/><circle cx="200" cy="20" r="2"/><circle cx="220" cy="20" r="2"/><circle cx="240" cy="20" r="2"/><circle cx="260" cy="20" r="2"/>
    <circle cx="20" cy="60" r="2"/><circle cx="40" cy="60" r="2"/><circle cx="60" cy="60" r="2"/><circle cx="80" cy="60" r="2"/><circle cx="100" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="160" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="200" cy="60" r="2"/><circle cx="220" cy="60" r="2"/><circle cx="240" cy="60" r="2"/><circle cx="260" cy="60" r="2"/>
    <circle cx="20" cy="100" r="2"/><circle cx="40" cy="100" r="2"/><circle cx="60" cy="100" r="2"/><circle cx="80" cy="100" r="2"/><circle cx="100" cy="100" r="2"/><circle cx="120" cy="100" r="2"/><circle cx="140" cy="100" r="2"/><circle cx="160" cy="100" r="2"/><circle cx="180" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="220" cy="100" r="2"/><circle cx="240" cy="100" r="2"/><circle cx="260" cy="100" r="2"/>
    <circle cx="20" cy="140" r="2"/><circle cx="40" cy="140" r="2"/><circle cx="60" cy="140" r="2"/><circle cx="80" cy="140" r="2"/><circle cx="100" cy="140" r="2"/><circle cx="120" cy="140" r="2"/><circle cx="140" cy="140" r="2"/><circle cx="160" cy="140" r="2"/><circle cx="180" cy="140" r="2"/><circle cx="200" cy="140" r="2"/><circle cx="220" cy="140" r="2"/><circle cx="240" cy="140" r="2"/><circle cx="260" cy="140" r="2"/>
    <circle cx="20" cy="180" r="2"/><circle cx="40" cy="180" r="2"/><circle cx="60" cy="180" r="2"/><circle cx="80" cy="180" r="2"/><circle cx="100" cy="180" r="2"/><circle cx="120" cy="180" r="2"/><circle cx="140" cy="180" r="2"/><circle cx="160" cy="180" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="200" cy="180" r="2"/><circle cx="220" cy="180" r="2"/><circle cx="240" cy="180" r="2"/><circle cx="260" cy="180" r="2"/>
