<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%">
  <!-- 배경: 연노랑 크림 -->
  <rect width="160" height="200" fill="#FFFDF2"/>
  
  <!-- 얇은 안쪽 테두리 -->
  <rect x="6" y="6" width="148" height="188" fill="none" stroke="#CBE7F6" stroke-width="1"/>

  <!-- 레트로 하트 & 별 미니멀 그래픽 (글자 일체 없음) -->
  <g transform="translate(80, 100)">
    <circle cx="0" cy="0" r="42" fill="#EBF6FC"/>
    <!-- 하트 -->
    <path d="M0 16 C-24 -4, -28 -24, 0 -24 C28 -24, 24 -4, 0 16 Z" fill="#7DC5E6" transform="scale(0.9) translate(0, -6)"/>
    <circle cx="0" cy="-6" r="4" fill="#FCE68A"/>
    <text x="32" y="-20" font-family="'Gulim', 'Dotum', monospace" font-size="16" fill="#FCE68A">★</text>
    <text x="-36" y="24" font-family="'Gulim', 'Dotum', monospace" font-size="14" fill="#7DC5E6">✦</text>
  </g>
</svg>
