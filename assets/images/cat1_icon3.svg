<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 칠기 흑칠 & 주칠 프레임 -->
  <rect width="100" height="100" fill="#0E0A12"/>
  <rect x="4" y="4" width="92" height="92" fill="#140D1A" stroke="#C83220" stroke-width="2"/>
  <rect x="8" y="8" width="84" height="84" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
  <!-- 네 모서리 금박 장식 -->
  <polygon points="8,8 18,8 8,18" fill="#D4AF37"/>
  <polygon points="92,8 82,8 92,18" fill="#D4AF37"/>
  <polygon points="8,92 18,92 8,82" fill="#D4AF37"/>
  <polygon points="92,92 82,92 92,82" fill="#D4AF37"/>

  <!-- 🎏 헤이안 일기책 (和綴じ本) & 붓 (筆) -->
  <g transform="translate(48, 50)">
    <!-- 전통 제본 책 (和本 / 帖) -->
    <rect x="-26" y="-24" width="40" height="50" fill="#F7F3E8" stroke="#AA820A" stroke-width="1.5"/>
    <rect x="-26" y="-24" width="8" height="50" fill="#3D2018"/>
    <!-- 전통 4혈 제본 실 (四つ目綴じ) -->
    <line x1="-22" y1="-24" x2="-22" y2="26" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="-22" cy="-15" r="1.5" fill="#C83220"/>
    <circle cx="-22" cy="-5" r="1.5" fill="#C83220"/>
    <circle cx="-22" cy="5" r="1.5" fill="#C83220"/>
    <circle cx="-22" cy="15" r="1.5" fill="#C83220"/>
    <!-- 책 제첨 (題籤 - 일기 제목 라벨) -->
    <rect x="-12" y="-18" width="10" height="34" fill="#FFFFFF" stroke="#C83220" stroke-width="1"/>
    <text x="-7" y="-6" font-family="serif" font-size="7" font-weight="bold" fill="#0E0A12" text-anchor="middle">日</text>
    <text x="-7" y="5" font-family="serif" font-size="7" font-weight="bold" fill="#0E0A12" text-anchor="middle">記</text>
    <!-- 대각선 붓 (筆) -->
    <g transform="rotate(35 0 0)">
      <!-- 붓대 (대나무/흑칠) -->
      <rect x="-2" y="-36" width="5" height="42" fill="#AA820A" stroke="#7A5800" stroke-width="0.8"/>
      <!-- 붓 촉 (모필 / 墨) -->
      <path d="M -2 6 L 3 6 L 0.5 16 Z" fill="#0E0A12"/>
      <rect x="-3" y="4" width="7" height="3" fill="#C83220"/>
    </g>
  </g>
</svg>