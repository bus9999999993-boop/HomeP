    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF6FC"/>
      <stop offset="50%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#EBF6FC"/>
    </linearGradient>
  </defs>
  <rect width="160" height="520" fill="url(#bannerBg)"/>
  
  <!-- 얇은 안쪽 테두리 -->
  <rect x="6" y="6" width="148" height="508" fill="none" stroke="#CBE7F6" stroke-width="1"/>

  <!-- 레트로 반짝이 별 & 리본 그래픽 (글자 일체 없음) -->
