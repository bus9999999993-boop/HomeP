<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <!-- 배경: 포근한 연노랑 크림 -->
  <rect width="800" height="440" fill="#FFFDF5"/>
  
  <!-- 각진 연하늘 이중 테두리 -->
  <rect x="6" y="6" width="788" height="428" fill="none" stroke="#7DC5E6" stroke-width="2"/>
  <rect x="12" y="12" width="776" height="416" fill="none" stroke="#CBE7F6" stroke-width="2"/>
  
  <!-- 상단 미니 레트로 타이틀 바 -->
  <rect x="14" y="14" width="772" height="30" fill="#E1F2FB"/>
  <text x="30" y="34" font-family="'Gulim', 'Dotum', monospace" font-size="12" font-weight="bold" fill="#2E7EAA">
    [ PHOTO ARCHIVE ★ RECTANGLE ]
  </text>
  <text x="770" y="34" font-family="'Gulim', 'Dotum', monospace" font-size="11" fill="#2E7EAA" text-anchor="end">
    main_photo.jpg
  </text>

  <!-- 중앙 대형 캔버스 영역 -->
  <rect x="35" y="56" width="730" height="360" fill="#FFF9EB" stroke="#F3CCA4" stroke-width="1"/>
  
  <!-- 레트로 그래픽 심볼 (별, 구름) -->
  <text x="400" y="180" font-family="'Gulim', 'Dotum', monospace" font-size="34" fill="#7DC5E6" text-anchor="middle">
    ★ ☁︎ ★
  </text>
  <text x="400" y="230" font-family="'Gulim', 'Dotum', sans-serif" font-size="18" font-weight="bold" fill="#254A5E" text-anchor="middle">
    가운데 메인 직사각형 사진 공간
  </text>
  <text x="400" y="265" font-family="'Gulim', 'Dotum', sans-serif" font-size="13" fill="#6A8F9E" text-anchor="middle">
    assets/images/main_photo.jpg 파일로 교체할 수 있습니다
  </text>
  
  <text x="400" y="330" font-family="'Gulim', 'Dotum', monospace" font-size="11" fill="#75B4D4" text-anchor="middle">
    *:+ﾟ Classic Retro Landscape ﾟ+:*
  </text>
</svg>
