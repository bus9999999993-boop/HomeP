<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="100%" height="100%">
  <!-- 배경: 연노랑 파스텔 -->
  <rect width="200" height="260" fill="#FFFDF2"/>
  
  <!-- 각진 연하늘 테두리 -->
  <rect x="4" y="4" width="192" height="252" fill="none" stroke="#7DC5E6" stroke-width="2"/>
  <rect x="10" y="10" width="180" height="240" fill="none" stroke="#CBE7F6" stroke-width="1"/>

  <!-- 은은한 미세 도트 질감 -->
  <g fill="#F5E4BE" opacity="0.3">
    <circle cx="30" cy="30" r="2"/><circle cx="70" cy="30" r="2"/><circle cx="110" cy="30" r="2"/><circle cx="150" cy="30" r="2"/><circle cx="170" cy="30" r="2"/>
    <circle cx="30" cy="70" r="2"/><circle cx="70" cy="70" r="2"/><circle cx="110" cy="70" r="2"/><circle cx="150" cy="70" r="2"/><circle cx="170" cy="70" r="2"/>
    <circle cx="30" cy="190" r="2"/><circle cx="70" cy="190" r="2"/><circle cx="110" cy="190" r="2"/><circle cx="150" cy="190" r="2"/><circle cx="170" cy="190" r="2"/>
    <circle cx="30" cy="230" r="2"/><circle cx="70" cy="230" r="2"/><circle cx="110" cy="230" r="2"/><circle cx="150" cy="230" r="2"/><circle cx="170" cy="230" r="2"/>
  </g>

  <!-- 중앙 책/별 그래픽 일러스트 (글자 일체 없음) -->
  <g transform="translate(100, 130)">
    <circle cx="0" cy="0" r="50" fill="#EBF6FC"/>
    <!-- 펼쳐진 책 -->
    <path d="M-30 18 Q0 10 0 25 Q0 10 30 18 L30 -12 Q0 -20 0 -5 Q0 -20 -30 -12 Z" fill="#FFFFFF" stroke="#7DC5E6" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="25" stroke="#7DC5E6" stroke-width="2"/>
    <!-- 책 속 작은 라인 -->
    <line x1="-22" y1="-2" x2="-8" y2="-5" stroke="#CBE7F6" stroke-width="1.5"/>
    <line x1="-22" y1="6" x2="-8" y2="3" stroke="#CBE7F6" stroke-width="1.5"/>
    <line x1="8" y1="-5" x2="22" y2="-2" stroke="#CBE7F6" stroke-width="1.5"/>
    <line x1="8" y1="3" x2="22" y2="6" stroke="#CBE7F6" stroke-width="1.5"/>
    <!-- 상단 반짝이는 별 -->
    <text x="0" y="-35" font-family="'Gulim', 'Dotum', monospace" font-size="22" fill="#FCE68A" text-anchor="middle">★</text>
    <text x="38" y="-22" font-family="'Gulim', 'Dotum', monospace" font-size="12" fill="#7DC5E6">✦</text>
    <text x="-38" y="-22" font-family="'Gulim', 'Dotum', monospace" font-size="12" fill="#7DC5E6">✦</text>
  </g>
</svg>
