<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 칠기 흑칠 & 주칠 프레임 -->
  <rect width="100" height="100" fill="#0E0A12"/>
  <rect x="4" y="4" width="92" height="92" fill="#140D1A" stroke="#C83220" stroke-width="2"/>
  <rect x="8" y="8" width="84" height="84" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
  <!-- 네 모서리 금박 장식 -->
  <polygon points="8,8 18,8 8,18" fill="#D4AF37"/>
  <polygon points="92,8 82,8 92,18" fill="#D4AF37"/>
  <polygon points="8,92 18,92 8,82" fill="#D4AF37"/>
  <polygon points="92,92 82,92 92,82" fill="#D4AF37"/>

  <!-- 📸 헤이안 금박 부채 (檜扇 / 扇子) & 렌즈 프레임 -->
  <g transform="translate(50, 52)">
    <!-- 펼쳐진 부채 형상 -->
    <path d="M 0 20 L -36 -12 A 44 44 0 0 1 36 -12 Z" fill="#F7F3E8" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M 0 20 L -36 -12 A 44 44 0 0 1 36 -12 Z" fill="#C83220" opacity="0.18"/>
    <!-- 부채 살 (扇骨) -->
    <line x1="0" y1="20" x2="-28" y2="-8" stroke="#AA820A" stroke-width="1"/>
    <line x1="0" y1="20" x2="-14" y2="-18" stroke="#AA820A" stroke-width="1"/>
    <line x1="0" y1="20" x2="0" y2="-22" stroke="#AA820A" stroke-width="1"/>
    <line x1="0" y1="20" x2="14" y2="-18" stroke="#AA820A" stroke-width="1"/>
    <line x1="0" y1="20" x2="28" y2="-8" stroke="#AA820A" stroke-width="1"/>
    <!-- 부채 위 붉은 태양 & 벚꽃 그림 -->
    <circle cx="0" cy="-6" r="14" fill="#C83220"/>
    <circle cx="0" cy="-6" r="11" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="0" cy="-6" r="6" fill="#FAD4DF"/>
    <!-- 부채 자루 매듭 & 붉은 술 장식 (房飾り) -->
    <circle cx="0" cy="20" r="3.5" fill="#D4AF37"/>
    <path d="M -3 23 L -6 38 L 6 38 L 3 23 Z" fill="#C83220"/>
    <line x1="-6" y1="38" x2="-6" y2="42" stroke="#C83220" stroke-width="1"/>
    <line x1="0" y1="38" x2="0" y2="44" stroke="#D4AF37" stroke-width="1"/>
    <line x1="6" y1="38" x2="6" y2="42" stroke="#C83220" stroke-width="1"/>
  </g>
</svg>